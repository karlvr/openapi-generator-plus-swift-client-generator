name: Node CI
on: [push]
jobs:
  build:
    # Use macOS as we compile with Swift
    runs-on: macos-latest
    strategy:
      matrix:
        node-version:
          - 18.x
          - 20.x
          - 22.x
          - 24.x
          - 26.x
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
      - name: Check out test specs
        uses: actions/checkout@v4
        with:
          repository: 'karlvr/openapi-generator-plus-generators'
          path: 'test-input'
      # https://pnpm.io/continuous-integration
      - uses: pnpm/action-setup@v3
        with:
          version: 10
      # Build and lint with the Node version that the development tools need
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lint
      - name: Use Node.js ${{ matrix.node-version }} for test
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: pnpm test
