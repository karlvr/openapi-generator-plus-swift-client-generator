openapi: 3.0.0
info:
  title: Query params test
  version: 1.0.0
paths:
  /things/{id}:
    get:
      operationId: searchThings
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: X-Trace
          in: header
          schema:
            type: string
        - name: q
          in: query
          required: true
          schema:
            type: string
        - name: limit
          in: query
          required: true
          schema:
            type: integer
        - name: note
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            format: int32
        - name: offset
          in: query
          schema:
            type: integer
            format: int64
        - name: ratio
          in: query
          schema:
            type: number
            format: double
        - name: score
          in: query
          schema:
            type: number
            format: float
        - name: active
          in: query
          schema:
            type: boolean
        - name: day
          in: query
          schema:
            type: string
            format: date
        - name: at
          in: query
          schema:
            type: string
            format: time
        - name: since
          in: query
          schema:
            type: string
            format: date-time
        - name: token
          in: query
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/Status'
        - name: tags
          in: query
          schema:
            type: array
            items:
              type: string
        - name: ids
          in: query
          schema:
            type: array
            items:
              type: integer
        - name: statuses
          in: query
          schema:
            type: array
            items:
              $ref: '#/components/schemas/Status'
        - name: filter
          in: query
          schema:
            $ref: '#/components/schemas/Filter'
      responses:
        '200':
          description: ok
  /widgets/{id}:
    get:
      operationId: listWidgets
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: colour
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: ok
components:
  schemas:
    Status:
      type: string
      enum:
        - available
        - pending
        - sold
    Filter:
      type: object
      properties:
        colour:
          type: string
        limit:
          type: integer
